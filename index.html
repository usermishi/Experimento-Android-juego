<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sarcastic Life Simulator: Infinite Saga</title>
    <style>
        :root { --neon-blue: #00f2ff; --death-red: #ff4444; --irony-gold: #fbbf24; }
        body { background: #0a0a0c; color: #d1d5db; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; padding: 20px; }
        #game-container { width: 100%; max-width: 800px; border: 2px solid #2d3748; background: #111827; padding: 2rem; border-radius: 8px; position: relative; }

        /* Stats */
        .hud { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid #2d3748; padding-bottom: 1rem; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #94a3b8; display: block; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--irony-gold); }

        /* Narrative Area */
        #narrative-box { min-height: 180px; margin-bottom: 2rem; }
        .sarcastic-prefix { color: var(--death-red); font-weight: bold; font-style: italic; display: block; margin-bottom: 0.5rem; }
        .story-text { font-size: 1.4rem; line-height: 1.4; color: #f9fafb; }

        /* Choices */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .choice-btn {
            background: #1f2937; border: 1px solid #374151; color: #e5e7eb; padding: 15px;
            text-align: left; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .choice-btn:hover { background: #374151; border-color: var(--neon-blue); padding-left: 25px; }
        .choice-btn::before { content: '>'; position: absolute; left: 10px; opacity: 0; }
        .choice-btn:hover::before { opacity: 1; }

        #log { font-size: 0.8rem; color: #4b5563; margin-top: 2rem; height: 100px; overflow-y: auto; border-top: 1px dashed #2d3748; padding-top: 10px; }
        .death-screen { color: var(--death-red); text-align: center; font-size: 2rem; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="stat-box"><span class="stat-label">🧬 RAZA</span><span id="stat-race" class="stat-val">?</span></div>
        <div class="stat-box"><span class="stat-label">❤️ VITALIDAD</span><span id="stat-hp" class="stat-val">100</span></div>
        <div class="stat-box"><span class="stat-label">🧠 EGO/INT</span><span id="stat-int" class="stat-val">10</span></div>
        <div class="stat-box"><span class="stat-label">⚖️ KARMA</span><span id="stat-kar" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">⌛ EDAD</span><span id="stat-age" class="stat-val">0</span></div>
    </div>

    <div id="narrative-box">
        <pre id="ascii-display"></pre>
        <span id="sarcasm-label" class="sarcastic-prefix"></span>
        <div id="story" class="story-text">Cargando tu miserable existencia...</div>
    </div>

    <div id="choices" class="options-grid"></div>

    <div id="log"></div>
</div>

<script>
    const player = { age: 0, hp: 100, int: 10, kar: 0, race: '', stage: 'childhood', flags: new Set(), majorDecisions: [] };

    const sarcasticComments = [
        "Una elección audaz. Veamos cómo arruinas esto.", "El destino te observa... y se ríe.",
        "Ah, la dulce sinfonía de las malas decisiones.", "Podrías haber elegido sabiamente. Pero no lo hiciste."
    ];

    const art = {
        book: `
          .--.                   .---.
      .---|__|           .-.     |~~~|
   .--|===|--|____.--.  |~|     |~~~|--.
   |  |===|  |    |  |--|~|     |~~~|  |
   |  |   |  |    |  |  |~|     |   |  |
   |  |   |  |    |  |--|~|-----|   |--|
   |  |   |  |    |  |  |~|     |   |  |
   '--'   '--'    '--'--'"'-----'"--'--'
`,
        sword: `
            /| ________________
O|===|* >________________>
            \\|
`,
        portal: `
          ,ad8888ba,
         d8"'    '"8b
        d8'        '8b
        88          88
        88          88
        Y8,        ,8P
         Y8a.    .a8P
          'Y88888P'
`,
        rocket: `
            /\\
           //\\\\
          //  \\\\
         |/----\\|
         |'    '|
         |  ||  |
         |  ||  |
         |  ||  |
        /|______|_\\
       /    /\\    \\
      |    |  |    |
`
    };

    let eventPools = {};

    function setupEvents() {
        return {
            fixed: { // Eventos que ocurren en orden
                'ELEMENT_SELECTION': {
                    text: "Antes de la forma, está la esencia. Elige tu afinidad elemental primordial.",
                    art: art.portal,
                    options: [
                        { t: "Fuego: Pasión y poder.", eff: () => { player.hp += 10; player.kar -= 5; addLog("Elegiste el Fuego.", true); }, next: 'RACE_SELECTION' },
                        { t: "Agua: Adaptabilidad y conocimiento.", eff: () => { player.int += 10; player.hp -= 5; addLog("Elegiste el Agua.", true); }, next: 'RACE_SELECTION' }
                    ]
                },
                'RACE_SELECTION': {
                    text: "Tu esencia anhela una forma. ¿Qué decides ser?",
                    art: art.book,
                    options: [
                        { t: "Humano: Versátil y ambicioso.", eff: () => { player.race = 'Humano'; addLog("Decidiste ser Humano.", true); } },
                        { t: "Elfo Silvano: Sabio y frágil.", eff: () => { player.race = 'Elfo'; player.int += 5; player.hp -= 10; addLog("Decidiste ser Elfo.", true); } }
                    ]
                },
                'DEATH': {
                    text: "El final. La luz se desvanece. Tus últimas memorias son un eco en el vacío.",
                    art: '',
                    onLoad: () => { player.hp = 0; }
                }
            },
            childhood: [ // Piscina de eventos aleatorios
                {
                    text: "Un matón te roba el almuerzo. ¿Qué haces?",
                    art: art.sword,
                    options: [
                        { t: "Llorar.", eff: () => { player.kar -= 5; addLog("El matón se ríe. Pasaste hambre."); }},
                        { t: "Intentar razonar con él.", eff: () => { if(player.int > 12) { addLog("Sorprendentemente, funcionó. Hablasteis de vuestros sentimientos."); player.int++; } else { addLog("Se aburrió y te dio un golpe."); player.hp -= 10; } }}
                    ]
                },
                {
                    text: "Encuentras un libro antiguo en un idioma que no entiendes.",
                    art: art.book,
                    options: [
                        { t: "Usarlo para encender una hoguera.", eff: () => { addLog("Fue una hoguera muy instructiva. Lástima que el libro fuera mágico."); player.kar -= 10; }},
                        { t: "Pasar años intentando descifrarlo.", eff: () => { player.int += 10; player.flags.add('SCHOLAR'); addLog("Descifraste el 'Tratado de la Nulidad Cósmica'. Ahora eres más listo y más triste."); }}
                    ]
                }
            ],
            adolescence: [
                {
                    text: "Es el festival del pueblo y te atreves a participar en el concurso de comer pasteles.",
                    art: art.portal, // Reutilizando arte
                    options: [
                        { t: "Comer con delicadeza.", eff: () => { addLog("No ganaste, pero al menos no vomitaste delante de todos."); }},
                        { t: "Devorar sin piedad.", eff: () => { player.hp += 5; addLog("Ganaste un peluche feo y una indigestión gloriosa."); }}
                    ]
                }
            ],
            adulthood: [
                 {
                    text: "El recaudador de impuestos visita tu humilde morada.",
                    art: art.sword,
                    options: [
                        { t: "Pagarle con una sonrisa falsa.", eff: () => { player.kar += 5; addLog("El sistema te lo agradece. Tu bolsillo no."); }},
                        { t: "Explicarle que eres un 'ciudadano soberano' y no reconoces su autoridad.", eff: () => { player.hp -= 20; addLog("Te arrestaron. Resulta que sí reconocen su autoridad."); }}
                    ]
                }
            ],
             space: [
                {
                    text: "Encuentras una nave abandonada. Parece funcional.",
                    art: art.rocket,
                    options: [
                        { t: "¡Al espacio!", eff: () => { player.stage = 'space'; addLog("¡Despegas hacia lo desconocido!", true); }},
                        { t: "Venderla por piezas.", eff: () => { player.int += 5; addLog("El dinero te da una efímera sensación de seguridad."); }}
                    ]
                },
                {
                    text: "Una sonda alienígena se estrella cerca. ¿Investigas?",
                    art: art.rocket,
                    options: [
                        { t: "Acercarte con cautela.", eff: () => { player.hp -= 15; addLog("Emitió una ráfaga de radiación. Ahora brillas en la oscuridad."); }},
                        { t: "Llamar a la guardia del pueblo.", eff: () => { addLog("Se llevaron la gloria y tú te quedaste con el miedo."); }}
                    ]
                }
            ]
        };
    }


    function startGame() {
        player.age = 0; player.hp = 100; player.int = 10; player.kar = 0; player.race = ''; player.stage = 'childhood'; player.flags = new Set(); player.majorDecisions = [];
        eventPools = setupEvents();
        updateUI();
        nextEvent('ELEMENT_SELECTION');
    }

    function nextEvent(eventId) {
        if (player.hp <= 0) {
            return endGame(`Moriste a los ${player.age} años.`);
        }

        let event;
        if (eventId) { // Es un evento fijo
            event = eventPools.fixed[eventId];
        } else { // Es un evento aleatorio de una piscina

            // Transición de etapas de la vida
            if(player.age > 18 && player.stage === 'childhood') player.stage = 'adolescence';
            if(player.age > 30 && player.stage === 'adolescence') player.stage = 'adulthood';
            if(player.age > 50 && player.stage === 'adulthood') player.stage = 'space'; // Oportunidad de ir al espacio

            let currentPool = eventPools[player.stage];
            if (!currentPool || currentPool.length === 0) {
                // Si la piscina está vacía, pasa a la siguiente o termina
                const stages = ['childhood', 'adolescence', 'adulthood', 'space'];
                let currentStageIndex = stages.indexOf(player.stage);
                if(currentStageIndex < stages.length - 1) {
                    player.stage = stages[currentStageIndex + 1];
                    currentPool = eventPools[player.stage];
                }
            }

            if (!currentPool || currentPool.length === 0) {
                 return endGame(`Llegaste a los ${player.age} años en un mundo que ya no tenía sorpresas para ti.`);
            }

            const eventIndex = Math.floor(Math.random() * currentPool.length);
            event = currentPool[eventIndex];
            currentPool.splice(eventIndex, 1); // Eliminar el evento para no repetirlo
        }

        if (!event) {
            return endGame("Te has perdido en el guion de la vida y ahora no existes.");
        }

        player.age += Math.floor(Math.random() * 5) + 1;
        updateUI();

        document.getElementById('ascii-display').innerText = event.art || '';
        document.getElementById('sarcasm-label').innerText = sarcasticComments[Math.floor(Math.random() * sarcasticComments.length)];
        document.getElementById('story').innerText = event.text;

        const box = document.getElementById('choices');
        box.innerHTML = '';

        if (!event.options || event.options.length === 0) {
            return setTimeout(() => nextEvent(), 2000); // Pausa y pasa al siguiente evento si no hay opciones
        }

        event.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt.t;
            btn.onclick = () => {
                if (opt.eff) opt.eff();
                if (opt.next) {
                    nextEvent(opt.next);
                } else {
                    nextEvent();
                }
            };
            box.appendChild(btn);
        });
    }

    function updateUI() {
        document.getElementById('stat-race').innerText = player.race || '?';
        document.getElementById('stat-hp').innerText = player.hp;
        document.getElementById('stat-int').innerText = player.int;
        document.getElementById('stat-kar').innerText = player.kar;
        document.getElementById('stat-age').innerText = player.age;
    }

    function addLog(msg, isMajor = false) {
        const log = document.getElementById('log');
        log.innerHTML = `<div>> ${msg}</div>` + log.innerHTML;
        if (isMajor) {
            player.majorDecisions.push(msg);
        }
    }

    function endGame(finalMessage) {
        let storySummary = player.majorDecisions.map(decision => `<li>${decision}</li>`).join('');
        let summaryHTML = storySummary ? `<div style="text-align:left; font-size:0.9rem; margin-top:20px;"><h3>Tu Destino Trazado:</h3><ul>${storySummary}</ul></div>` : '';

        document.getElementById('narrative-box').innerHTML = `<div class="death-screen">FIN DE TU MISERIA<br><span style="font-size:1rem">${finalMessage}</span></div>${summaryHTML}`;
        document.getElementById('choices').innerHTML = `<button class="choice-btn" onclick="location.reload()">Intentar no fracasar de nuevo</button>`;
    }

    startGame();
</script>

</body>
</html>
