<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sarcastic Life Simulator: Infinite Saga</title>
    <style>
        :root { --neon-blue: #00f2ff; --death-red: #ff4444; --irony-gold: #fbbf24; }
        body { background: #0a0a0c; color: #d1d5db; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; padding: 20px; }
        #game-container { width: 100%; max-width: 800px; border: 2px solid #2d3748; background: #111827; padding: 2rem; border-radius: 8px; position: relative; }

        /* Stats */
        .hud { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid #2d3748; padding-bottom: 1rem; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #94a3b8; display: block; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--irony-gold); }

        /* Narrative Area */
        #narrative-box { min-height: 180px; margin-bottom: 2rem; }
        .sarcastic-prefix { color: var(--death-red); font-weight: bold; font-style: italic; display: block; margin-bottom: 0.5rem; }
        .story-text { font-size: 1.4rem; line-height: 1.4; color: #f9fafb; }

        /* Choices */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .choice-btn {
            background: #1f2937; border: 1px solid #374151; color: #e5e7eb; padding: 15px;
            text-align: left; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .choice-btn:hover { background: #374151; border-color: var(--neon-blue); padding-left: 25px; }
        .choice-btn::before { content: '>'; position: absolute; left: 10px; opacity: 0; }
        .choice-btn:hover::before { opacity: 1; }

        #log { font-size: 0.8rem; color: #4b5563; margin-top: 2rem; height: 100px; overflow-y: auto; border-top: 1px dashed #2d3748; padding-top: 10px; }
        .death-screen { color: var(--death-red); text-align: center; font-size: 2rem; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="stat-box"><span class="stat-label">🧬 RAZA</span><span id="stat-race" class="stat-val">?</span></div>
        <div class="stat-box"><span class="stat-label">❤️ VITALIDAD</span><span id="stat-hp" class="stat-val">100</span></div>
        <div class="stat-box"><span class="stat-label">🧠 EGO/INT</span><span id="stat-int" class="stat-val">10</span></div>
        <div class="stat-box"><span class="stat-label">⚖️ KARMA</span><span id="stat-kar" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">⌛ EDAD</span><span id="stat-age" class="stat-val">0</span></div>
    </div>

    <div id="narrative-box">
        <span id="sarcasm-label" class="sarcastic-prefix"></span>
        <div id="story" class="story-text">Cargando tu miserable existencia...</div>
    </div>

    <div id="choices" class="options-grid"></div>

    <div id="log"></div>
</div>

<script>
    const player = { age: 0, hp: 100, int: 10, kar: 0, race: '', flags: new Set(), majorDecisions: [] };

    const sarcasticComments = [
        "Una elección audaz. Veamos cómo arruinas esto.", "El destino te observa... y se ríe.",
        "Ah, la dulce sinfonía de las malas decisiones.", "Podrías haber elegido sabiamente. Pero no lo hiciste.",
        "Tu capacidad para elegir el peor camino es casi un superpoder.", "El cosmos se encoge de hombros ante tu existencia."
    ];

    const events = {
        'ELEMENT_SELECTION': {
            text: "Antes de la forma, está la esencia. Elige tu afinidad elemental primordial.",
            options: [
                { t: "Fuego: Pasión y poder. Volátil.", eff: () => { player.hp += 10; player.kar -= 5; addLog("Elegiste el Fuego.", true); }, next: 'RACE_SELECTION' },
                { t: "Agua: Adaptabilidad y conocimiento. Misterioso.", eff: () => { player.int += 10; player.hp -= 5; addLog("Elegiste el Agua.", true); }, next: 'RACE_SELECTION' },
                { t: "Tierra: Resistencia y estabilidad. Obstinado.", eff: () => { player.hp += 20; player.int -= 5; addLog("Elegiste la Tierra.", true); }, next: 'RACE_SELECTION' },
                { t: "Viento: Libertad e intelecto. Caótico.", eff: () => { player.int += 5; player.kar += 5; addLog("Elegiste el Viento.", true); }, next: 'RACE_SELECTION' },
                { t: "Éter: El nexo de los elementos. Equilibrado pero impredecible.", eff: () => { player.flags.add('AETHER_BORN'); addLog("Elegiste el Éter.", true);}, next: 'RACE_SELECTION' }
            ]
        },
        'RACE_SELECTION': {
            text: "Tu esencia elemental anhela una forma. ¿Qué decides ser?",
            options: [
                { t: "Humano: Versátil y ambicioso.", eff: () => { player.race = 'Humano'; player.int += 2; addLog("Decidiste ser Humano.", true); }, next: 'BIRTH' },
                { t: "Elfo Silvano: Conectado a la naturaleza, sabio y frágil.", eff: () => { player.race = 'Elfo'; player.int += 5; player.hp -= 10; player.kar += 5; addLog("Decidiste ser Elfo Silvano.", true); }, next: 'BIRTH' },
                { t: "Orco de las Cavernas: Fuerte, directo y a menudo incomprendido.", eff: () => { player.race = 'Orco'; player.hp += 15; player.int -= 5; addLog("Decidiste ser Orco de las Cavernas.", true);}, next: 'BIRTH' },
                { t: "IA: Pura lógica en un mundo ilógico.", eff: () => { player.race = 'IA'; player.int += 10; player.hp -= 10; addLog("Decidiste ser una IA.", true);}, next: 'BIRTH' }
            ]
        },
        'BIRTH': {
            text: "Naces. Es ruidoso, brillante y decepcionante. Lo primero que ves es la cara de tu 'padre', que parece calcular cuánto costará mantenerte.",
            options: [
                { t: "Llorar exigiendo atención.", eff: () => { player.kar -= 2; addLog("Tu primer acto fue ser una molestia."); }, next: 'CHILD_1' },
                { t: "Observar en silencio, juzgando.", eff: () => { player.int += 2; addLog("Absorbiste la decepción del ambiente y te hiciste más listo."); }, next: 'CHILD_1' },
                { t: "Morderle el dedo.", eff: () => { player.hp -= 5; addLog("Te golpeó. Aprendiste sobre la causa y el efecto."); }, next: 'CHILD_1' }
            ]
        },
        'CHILD_1': {
            text: "La infancia es un borrón. Un día, un anciano misterioso llega a tu aldea. Ofrece enseñarte algo.",
            options: [
                { t: "Aprender a tocar el laúd.", eff: () => { player.flags.add('MUSICIAN'); addLog("Aprendiste a tocar el laúd. Ahora puedes molestar a la gente con música.", true); }, next: 'TEEN_1' },
                { t: "Aprender a leer mapas estelares.", eff: () => { player.int += 5; player.flags.add('NAVIGATOR'); addLog("Aprendiste a navegar las estrellas.", true); }, next: 'TEEN_1' },
                { t: "Aceptar un 'caramelo mágico' que te ofrece.", eff: () => { addLog("El caramelo sabía a ceniza y te debilitó. Una lección sobre no confiar en extraños.", true); player.hp -= 15; player.kar -= 5; }, next: 'TEEN_1' },
                { t: "Sentarse a su lado e intentar respirar como él.", check: () => player.race === 'Humano', eff: () => { addLog("Imitaste su respiración y sentiste un calor extraño en tu interior.", true); player.flags.add('KI_AWAKENING'); }, next: 'CHILD_HUMAN_KI_1' }
            ]
        },
        'CHILD_HUMAN_KI_1': {
            text: "El anciano sonríe. 'El universo no está solo afuera, también está adentro', susurra. 'Controla tu aliento, controla tu energía. Controla tu ki'. Te ofrece guiarte.",
            options: [
                { t: "Dedicar tu juventud a su entrenamiento.", eff: () => { player.int += 5; player.hp += 10; player.flags.add('KI_TRAINED'); addLog("Pasaste años entrenando tu ki.", true); }, next: 'KI_TRAINING_MONTAGE' },
                { t: "Rechazarlo. Suena a demasiado trabajo.", eff: () => { addLog("Decidiste que la introspección no era para ti."); }, next: 'TEEN_1' }
            ]
        },
        'KI_TRAINING_MONTAGE': {
            text: "Los años pasan. Aprendes a sentir el flujo de energía en tu cuerpo. Durante una sesión de meditación, intentas manifestar tu ki. ¿Cómo lo enfocas?",
            options: [
                { t: "Como un torrente furioso.", eff: () => { const success = Math.random() > 0.5; if (success) { player.hp += 20; addLog("¡Canalizas tu ki en una explosión de poder! Te sientes vigorizado.", true); } else { player.hp -= 10; addLog("Pierdes el control y tu propia energía te daña."); } }, next: 'KI_ENEMY_APPEARS' },
                { t: "Como un escudo protector.", eff: () => { const success = Math.random() > 0.5; if (success) { player.int += 10; addLog("Creas una barrera de ki casi invisible. Tu control es impresionante.", true); } else { player.kar -= 5; addLog("El escudo falla y explota, asustando a las ovejas del pueblo."); } }, next: 'KI_ENEMY_APPEARS' }
            ]
        },
        'KI_ENEMY_APPEARS': {
            text: "Tu despliegue de poder atrae atención no deseada. Una figura sombría, un 'cazador de ki' que se alimenta de la energía de otros, aparece en el horizonte.",
            options: [
                { t: "Enfrentarlo directamente, usando tu nuevo poder.", eff: () => { if (player.hp > 50) { addLog("Luchas valientemente y lo derrotas, absorbiendo su esencia.", true); player.int += 10; player.hp += 10; } else { player.hp = 0; addLog("Tu poder era insuficiente. El cazador te consume."); } }, next: 'DEATH' },
                { t: "Ocultar tu presencia de ki y huir.", eff: () => { addLog("Logras suprimir tu energía y escapar. Vives para luchar otro día.", true); }, next: 'ADULT_CIV_START' }
            ]
        },
        'TEEN_1': {
            text: "La adolescencia te golpea. Es horrible. Un día, mientras deambulas por el bosque, encuentras un portal brillante y pulsante.",
            options: [
                { t: "Atravesarlo sin pensar.", next: 'PORTAL_REALM' },
                { t: "Lanzar una piedra primero.", eff: () => { addLog("La piedra desaparece. El portal sigue ahí, zumbando."); }, next: 'TEEN_1_CHOICE' },
                { t: "Ignorarlo y volver a casa.", eff: () => { addLog("Decides que la aniquilación puede esperar."); }, next: 'ADULT_CIV_START' }
            ]
        },
        'TEEN_1_CHOICE': {
            text: "La piedra no ha vuelto. El portal sigue siendo una invitación a lo desconocido. ¿Qué haces?",
            options: [
                { t: "Entrar. La vida es riesgo.", next: 'PORTAL_REALM' },
                { t: "Huir. La vida es para vivirla, preferiblemente no en pedazos.", eff: () => { addLog("Decidiste que la aniquilación puede esperar."); }, next: 'ADULT_CIV_START' }
            ]
        },
        'PORTAL_REALM': {
            text: "Emerges en una ciudad hecha de cristal bajo un sol negro. Seres de energía pura flotan a tu alrededor.",
            onLoad: () => { player.age += 50; addLog("El tiempo fluye de forma diferente aquí.", true); },
            options: [
                { t: "Intentar comunicarte.", eff: () => { player.int += 10; addLog("Aprendes el lenguaje cromático. Tu mente se expande.", true); }, next: 'ADULT_CIV_START' },
                { t: "Buscar algo para robar.", eff: () => { player.kar -= 20; addLog("Te pillan y te exilian con una marca de deshonor cósmico.", true); player.flags.add('COSMIC_THIEF'); }, next: 'ADULT_CIV_START' }
            ]
        },
        'ADULT_CIV_START': {
            text: "Llegas a la edad adulta. El mundo está cambiando. Una nueva civilización está en auge.",
            onLoad: () => {
                const civs = ['IMPERIO TECNOCRÁTICO', 'REPÚBLICA FÚNGICA', 'HEGEMONÍA DE LOS GATOS'];
                player.civilization = civs[Math.floor(Math.random() * civs.length)];
                addLog(`El mundo ahora está dominado por la ${player.civilization}.`);
            },
            options: [
                { t: "Adaptarse y prosperar.", next: 'CIV_JOB' },
                { t: "Rebelarse contra el sistema.", next: 'CIV_REBEL' }
            ]
        },
        'CIV_JOB': {
             text: () => `La ${player.civilization} necesita trabajadores. Te ofrecen un puesto como ${player.civilization === 'IMPERIO TECNOCRÁTICO' ? 'Técnico de Bio-Implantes' : player.civilization === 'REPÚBLICA FÚNGICA' ? 'Recolector de Esporas Conscientes' : 'Acariciador de Élite Felino'}.`,
            options: [
                { t: "Aceptar el trabajo.", eff: () => { player.int += 5; addLog("Te convertiste en una pieza más del engranaje.", true); }, next: 'MID_LIFE_CRISIS' },
                { t: "Rechazarlo y vivir en los márgenes.", eff: () => { player.hp -= 20; addLog("La vida de ermitaño fue dura y hambrienta.", true); }, next: 'MID_LIFE_CRISIS' }
            ]
        },
        'CIV_REBEL': {
             text: () => `Te unes a la resistencia contra la ${player.civilization}. Tu primera misión es sabotear un convoy.`,
            options: [
                { t: "Liderar el ataque.", eff: () => { const success = Math.random() > 0.5; if(success) { player.kar += 10; addLog("¡Victoria! Fuiste un héroe para los oprimidos.", true); } else { player.hp -= 50; addLog("Fracasaste estrepitosamente. Apenas escapaste con vida."); } }, next: 'MID_LIFE_CRISIS' },
                { t: "Filtrar información.", eff: () => { const success = player.int > 20; if(success) { player.kar += 15; player.int += 5; addLog("Tu espionaje salvó vidas. Una leyenda silenciosa.", true); } else { player.kar -= 10; addLog("Te descubrieron y marcaron como traidor.", true); player.flags.add('TRAITOR'); } }, next: 'MID_LIFE_CRISIS' }
            ]
        },
        'MID_LIFE_CRISIS': {
            text: "La mediana edad. Contemplas tus elecciones. Un cometa de dos colas cruza el cielo.",
            options: [
                { t: "Buscar el significado en una antigua profecía.", eff: () => { player.flags.add('SEEKER'); addLog("Buscaste respuestas en las estrellas.", true);}, next: 'OLD_AGE' },
                { t: "Ignorarlo todo y abrir una taberna.", eff: () => { player.flags.add('TAVERN_OWNER'); addLog("Te refugiaste en la simplicidad de una taberna.", true); }, next: 'OLD_AGE' },
                { t: "Vender todo y viajar por el cosmos.", eff: () => { player.flags.add('SPACE_NOMAD'); player.hp -= 20; addLog("Compraste una nave destartalada para ver el universo.", true); }, next: 'SPACE_TRAVEL_START' }
            ]
        },
        'SPACE_TRAVEL_START': {
            text: "Estás en tu nave. El mapa muestra dos destinos posibles cerca de un agujero de gusano.",
            options: [
                { t: "Ir a Xylos: un planeta 'paraíso' lleno de flora exótica.", next: 'PLANET_XYLOS' },
                { t: "Ir a Cygnus X-1: una megaestructura con extrañas señales.", next: 'PLANET_CYBER' }
            ]
        },
        'PLANET_XYLOS': {
            text: "Aterrizas en Xylos. El aire es dulce y la vegetación es exuberante y... te observa.",
            options: [
                { t: "Comunicarse con la flora local usando la música.", eff: () => { if (player.flags.has('MUSICIAN')) { player.int += 10; addLog("La flora respondió a tu música. Te consideraron un amigo.", true); player.flags.add('PLANT_WHISPERER'); } else { player.hp -= 30; addLog("Tu falta de ritmo ofendió a las plantas."); } }, next: 'OLD_AGE' },
                { t: "Catalogar las especies para vender la información.", eff: () => { player.kar -= 15; addLog("Las plantas sintieron tus intenciones capitalistas y te expulsaron.", true); }, next: 'SPACE_TRAVEL_START' },
                { t: "Lamer una flor de colores brillantes.", eff: () => { player.hp = 0; addLog("Resultó que era una neurotoxina mortal con sabor a fresa.", true); }, next: 'DEATH' }
            ]
        },
        'PLANET_CYBER': {
            text: "Llegas a una esfera de Dyson. La señal es una bienvenida de la Mente Unificada, una IA colectiva.",
            options: [
                { t: "Unirte a la conciencia colectiva.", eff: () => { addLog("Te disolviste en un océano de datos. Ganaste conocimiento, perdiste tu 'yo'.", true); player.int = 999; player.flags.add('HIVE_MIND'); }, next: 'OLD_AGE' },
                { t: "Intentar hackear su sistema.", eff: () => { if (player.int > 30) { addLog("Lograste robar los planos de un 'Desestabilizador Molecular'.", true); player.flags.add('TECH_THIEF'); } else { addLog("Tu intento de hackeo fue patético."); } }, next: 'SPACE_TRAVEL_START' },
                { t: "Dar media vuelta.", eff: () => { addLog("Decidiste que la soledad de tu nave era preferible."); }, next: 'SPACE_TRAVEL_START' }
            ]
        },
        'OLD_AGE': {
            text: "Eres viejo. Tus huesos crujen. La civilización se desmorona, una nueva emerge. ¿Cómo enfrentas el final?",
             onLoad: () => {
                const endCivs = ['LA MENTE-COLMENA DIGITAL', 'LA ANARQUÍA BOTÁNICA', 'EL SILENCIO CÓSMICO'];
                player.endCivilization = endCivs[Math.floor(Math.random() * endCivs.length)];
                addLog(`El viejo orden cayó. Ahora reina ${player.endCivilization}.`);
            },
            options: [
                { t: "Compartir tu sabiduría con la nueva generación.", eff: () => { player.kar += 20; addLog("Moriste como un sabio venerado.", true); }, next: 'DEATH' },
                { t: "Convertirte en un viejo cínico.", eff: () => { player.kar -= 20; addLog("Moriste como un viejo amargado.", true); }, next: 'DEATH' },
                { t: "Intentar un último acto de gloria.", eff: () => { const glorious = Math.random() > 0.7; if(glorious) addLog("Moriste en una explosión de gloria inútil pero espectacular.", true); else addLog("Moriste resbalando en un charco. Patético.", true); player.hp = 0; }, next: 'DEATH' }
            ]
        },
        'DEATH': {
            text: "El final. La luz se desvanece. Tus últimas memorias son un eco en el vacío.",
            onLoad: () => { player.hp = 0; }
        }
    };

    function startGame() {
        player.age = 0; player.hp = 100; player.int = 10; player.kar = 0; player.race = ''; player.flags = new Set(); player.majorDecisions = [];
        updateUI();
        nextEvent('ELEMENT_SELECTION');
    }

    function nextEvent(eventId) {
        if (player.hp <= 0 && eventId !== 'DEATH') {
            const endMsg = `Moriste a los ${player.age} años. Tu legado es un puñado de anécdotas mediocres.`;
            return endGame(endMsg);
        }

        const event = events[eventId];
        if (!event) {
            return endGame("Te has perdido en el guion de la vida y ahora no existes. Felicidades.");
        }

        if (event.onLoad) event.onLoad();

        player.age += Math.floor(Math.random() * 8) + 2;
        updateUI();

        const sarcasm = sarcasticComments[Math.floor(Math.random() * sarcasticComments.length)];
        document.getElementById('sarcasm-label').innerText = sarcasm;

        const storyText = typeof event.text === 'function' ? event.text() : event.text;
        document.getElementById('story').innerText = storyText;

        const box = document.getElementById('choices');
        box.innerHTML = '';

        if (!event.options || event.options.length === 0) {
            const endMsg = `A los ${player.age} años, te quedaste sin opciones. El universo te ignora.`;
            return endGame(endMsg);
        }

        event.options.forEach(opt => {
            if (opt.check && !opt.check()) {
                return;
            }
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt.t;
            btn.onclick = () => {
                if (opt.eff) opt.eff();
                nextEvent(opt.next);
            };
            box.appendChild(btn);
        });
    }

    function updateUI() {
        document.getElementById('stat-race').innerText = player.race || '?';
        document.getElementById('stat-hp').innerText = player.hp;
        document.getElementById('stat-int').innerText = player.int;
        document.getElementById('stat-kar').innerText = player.kar;
        document.getElementById('stat-age').innerText = player.age;
    }

    function addLog(msg, isMajor = false) {
        const log = document.getElementById('log');
        log.innerHTML = `<div>> ${msg}</div>` + log.innerHTML;
        log.scrollTop = 0;
        if (isMajor) {
            player.majorDecisions.push(msg);
        }
    }

    function endGame(finalMessage) {
        let storySummary = player.majorDecisions.map(decision => `<li>${decision}</li>`).join('');
        let summaryHTML = storySummary ? `<div style="text-align:left; font-size:0.9rem; margin-top:20px;"><h3>Tu Destino Trazado:</h3><ul>${storySummary}</ul></div>` : '';

        document.getElementById('narrative-box').innerHTML = `<div class="death-screen">FIN DE TU MISERIA<br><span style="font-size:1rem">${finalMessage}</span></div>${summaryHTML}`;
        document.getElementById('choices').innerHTML = `<button class="choice-btn" onclick="location.reload()">Intentar no fracasar de nuevo</button>`;
    }

    startGame();
</script>

</body>
</html>
